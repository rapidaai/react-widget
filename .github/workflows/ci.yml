name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: 01 Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage -- --runInBand

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: 02 Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build widget
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Verify build output
        run: |
          set -euo pipefail
          test -s dist/app.min.js
          size=$(stat -c%s dist/app.min.js)
          echo "Bundle size: ${size} bytes ($((size / 1024)) KiB)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload widget artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: widget-dist-${{ github.sha }}
          path: dist/app.min.js
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: 03 End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            screenshots/test-results/
          if-no-files-found: ignore
          retention-days: 14

  ci-success:
    name: 04 CI Complete
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
      - e2e
    if: always()
    steps:
      - name: Check required jobs
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          test "$VALIDATE_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$E2E_RESULT" = success

      - name: Write summary
        run: |
          {
            echo "## CI Results"
            echo ""
            echo "| Stage | Result |"
            echo "|-------|--------|"
            echo "| Validate | ${{ needs.validate.result }} |"
            echo "| Build | ${{ needs.build.result }} |"
            echo "| End-to-end | ${{ needs.e2e.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
