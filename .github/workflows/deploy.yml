name: Build and Deploy to S3
on:
  push:
    branches:
      - main # Trigger the workflow on push to the main branch
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18" # Specify the Node.js version

      - name: Install dependencies
        run: npm install

      - name: Install Protobuf Compiler (protoc) Version 3.20.3
        run: |
          sudo apt-get update
          wget https://github.com/protocolbuffers/protobuf/releases/download/v3.20.3/protoc-3.20.3-linux-x86_64.zip
          unzip protoc-3.20.3-linux-x86_64.zip -d protoc3
          sudo mv protoc3/bin/* /usr/local/bin/
          sudo mv protoc3/include/* /usr/local/include/
          rm -rf protoc-3.20.3-linux-x86_64.zip protoc3

      - name: Generate gRPC-Web and TypeScript Stubs
        run: |
          PROTOC_GEN_TS_PATH="./node_modules/.bin/protoc-gen-ts"
          PROTOC_GEN_WEB_PATH="./node_modules/.bin/protoc-gen-grpc-web"
          OUT_DIR="./src/app/clients/protos"
          PROTO_DIR="./src/app/clients/protos"
          protoc --plugin="protoc-gen-ts=${PROTOC_GEN_TS_PATH}" --js_out=import_style=commonjs,binary:$OUT_DIR --ts_out=service=grpc-web:$OUT_DIR -I=$PROTO_DIR "${PROTO_DIR}"/*.proto

      - name: Build the project
        run: npm run build

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 cp ./dist/app.min.js s3://${{ secrets.S3_BUCKET_NAME }}/public/scripts/app.min.js \
            --region $AWS_REGION --acl public-read

      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3SJXANXL6IYCB \
            --paths "/public/scripts/*"
